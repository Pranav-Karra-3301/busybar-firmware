<!DOCTYPE html>
<html lang="en">

<body>
    <h1>Mongoose HTTPD demo</h1>
    <div style="height: 0.3em;">&nbsp;</div>
    <button id="btn1">Get FW version</button>
    <br />
    <button id="btn_led_on">LED ON (GET)</button>
    <button id="btn_led_off">LED OFF (GET)</button>
    <br />
    <button id="btn_led_json_on">LED ON (POST)</button>
    <button id="btn_led_json_off">LED OFF (POST)</button>

    <div style="margin-top: 1em;">Action log:</div>
    <div id="log" style="background: #eee; height: 10em; padding: 0.5em; overflow:auto;">
        <div>
</body>
<script>
    var E = function (id) { return document.getElementById(id); };
    var btn1 = E('btn1'), msglog = E('log');
    var btn_led_on = E('btn_led_on'), btn_led_off = E('btn_led_off');
    var btn_led_json_on = E('btn_led_json_on'), btn_led_json_off = E('btn_led_json_off');

    var enable = function (en) { btn1.disabled = !en; };
    var log = text => msglog.innerHTML += text + '<br/>\n';

    enable(true);

    btn1.onclick = ev => fetch('/api/version')
        .then(r => r.json())
        .then(r => {
            console.log(r);
            log('GET /api/version: ' + JSON.stringify(r))
        })
        .catch(err => console.log(err));

    const set_led = (state) =>
        fetch('/api/led?state=' + state)
            .then(r => r.json())
            .then(r => {
                console.log(r);
                log('GET /api/led?state=' + state + ': ' + JSON.stringify(r))
            })
            .catch(err => console.log(err));

    btn_led_on.onclick = ev => set_led(1);
    btn_led_off.onclick = ev => set_led(0);

    const set_led_json = (state) =>
        fetch('/api/led', { method: 'POST', body: JSON.stringify({ "state": state }) })
            .then(r => r.json())
            .then(r => {
                console.log(r);
                log('POST /api/led: ' + JSON.stringify(r))
            })
            .catch(err => console.log(err));

    btn_led_json_on.onclick = ev => set_led_json(1);
    btn_led_json_off.onclick = ev => set_led_json(0);
</script>

</html>
